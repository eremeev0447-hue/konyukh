<style>
:root {
  --bg: #161614;
  --panel: rgba(46, 45, 41, 0.86);
  --panel-2: rgba(30, 30, 27, 0.9);
  --line: rgba(255, 255, 255, 0.07);
  --text: #d9d4ca;
  --muted: #9b968c;
  --white: #f1ede4;
  --green: #7ba736;
  --red: #b8342a;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.35 "Roboto Condensed", "Arial Narrow", system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-user-select: none; user-select: none;
}
.wrap { max-width: 520px; margin: 0 auto; padding: 10px 12px 28px; }
.stage {
  position: sticky; top: 0; z-index: 5; height: min(54vh, calc((100vw - 24px) * 1.25), 640px);
  border-radius: 0 0 6px 6px; overflow: hidden; margin: -10px -12px 0; box-shadow: 0 6px 14px rgba(0,0,0,.45);
  background: radial-gradient(120% 90% at 50% 18%, #3a3833 0%, #24231f 55%, #171714 100%);
  border: 1px solid var(--line);
}
.stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; transition: opacity .18s; }
.stage img.hide { opacity: 0; }
.stage .seed {
  position: absolute; left: 10px; bottom: 9px; font-size: 12px; color: var(--muted);
  background: rgba(0,0,0,.35); padding: 3px 7px; border-radius: 3px; letter-spacing: .3px;
}
.stage .dice {
  position: absolute; right: 10px; bottom: 9px; border: 0; border-radius: 3px; padding: 7px 11px;
  background: rgba(0,0,0,.45); color: var(--white); font: inherit; font-size: 13px; text-transform: uppercase;
  letter-spacing: .5px; cursor: pointer;
}
.stage .dice:active { background: var(--red); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin-top: 10px; }
.cap { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin-bottom: 7px; display: flex; justify-content: space-between; }
.cap b { color: var(--text); font-weight: 500; text-transform: none; letter-spacing: 0; font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--panel-2); color: var(--text); font: inherit; font-size: 14px;
  padding: 7px 11px; border-radius: 3px; cursor: pointer;
}
.chip.on { background: var(--red); border-color: var(--red); color: var(--white); }
.chip:disabled { opacity: .35; }
.arrows { display: flex; align-items: center; gap: 8px; }
.arrows button {
  width: 42px; height: 38px; border: 1px solid var(--line); background: var(--panel-2); color: var(--white);
  font-size: 20px; border-radius: 3px; cursor: pointer;
}
.arrows button:active { background: var(--red); }
.arrows .val { flex: 1; text-align: center; font-size: 16px; color: var(--white); }
.arrows .val small { display: block; font-size: 12px; color: var(--muted); }
.sw { display: flex; flex-wrap: wrap; gap: 8px; }
.sw button {
  display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
  font: inherit; font-size: 13px; padding: 5px 9px 5px 5px; border-radius: 3px; cursor: pointer;
}
.sw button i { width: 20px; height: 20px; border-radius: 50%; border: 1px solid rgba(255,255,255,.18); display: block; }
.sw button.on { border-color: var(--red); background: rgba(184,52,42,.25); color: var(--white); }
.sw button:disabled { opacity: .3; }
.hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
.foot { margin-top: 14px; font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>

const IMG = "chars/";

const RACE = { ML: ["male", "Светлый"], MD: ["male", "Темнокожий"], MA: ["male", "Азиат"],
               FL: ["female", "Светлая"], FD: ["female", "Темнокожая"], FA: ["female", "Азиатка"] };
const HAIR = { none: "Лысый", bun: "Пучок", crewcut: "Короткая", buzzcut: "Ёжик", buzzcutcurly: "Кудрявый ёжик",
               midlength: "До плеч", pixie: "Пикси", ponytail: "Хвост" };
const COLOUR = { Black: ["Чёрные", "#1d1b1a"], DarkBrown: ["Тёмно-каштановые", "#3a2518"], Brown: ["Каштановые", "#5b3a22"],
                 MousseyBrown: ["Русые", "#7a6248"], Auburn: ["Рыжие", "#8f3f1b"], Blonde: ["Светлые", "#c7a46a"],
                 Grey: ["Седые", "#a29f99"] };
const BEARD = { none: "Без бороды", short: "Короткая", mid: "Густая" };
const W = { gender: 64, race: 32, face: 16, hair: 8, beard: 4, colour: 2 };   // what to keep when a choice forces others

const rows = D.map(d => ({ seed: d[0], race: L.race[d[1]], face: L.face[d[2]], hair: L.hair[d[3]], colour: L.colour[d[4]],
                           beard: L.beard[d[5]], gender: RACE[L.race[d[1]]][0] }));
const by = (f) => rows.filter(f);
const uniq = (a) => [...new Set(a)];
let S = null;

function best(want, fixed) {
  // the look with `fixed` traits that keeps the most important other traits of `want`
  let top = null, ts = -1;
  for (const r of rows) {
    if (Object.keys(fixed).some(k => r[k] !== fixed[k])) continue;
    let s = 0;
    for (const k in W) if (r[k] === want[k]) s += W[k];
    if (s > ts) { ts = s; top = r; }
  }
  return top;
}

function set(k, v) {
  const fixed = { [k]: v };
  if (k !== "gender") fixed.gender = S.gender;
  if (["face", "hair", "colour", "beard"].includes(k)) fixed.race = S.race;
  if (k === "colour" || k === "beard") { fixed.face = S.face; }
  const r = best(S, fixed);
  if (r) show(r);
}

function chips(el, values, cur, label, key, enabled) {
  el.innerHTML = "";
  for (const v of values) {
    const b = document.createElement("button");
    b.className = "chip" + (v === cur ? " on" : "");
    b.textContent = label(v);
    if (enabled && !enabled(v)) b.disabled = true;
    b.onclick = () => { haptic(); set(key, v); };
    el.appendChild(b);
  }
}

function hairName(h, g) {
  if (h === "none") return g === "female" ? "Лысая" : "Лысый";
  return HAIR[h] || h;
}

function render() {
  const g = S.gender;
  chips(document.getElementById("gender"), ["male", "female"], g, v => v === "male" ? "Мужчина" : "Женщина", "gender");
  chips(document.getElementById("race"), Object.keys(RACE).filter(r => RACE[r][0] === g), S.race, v => RACE[v][1], "race");
  const faces = uniq(by(r => r.race === S.race).map(r => r.face));
  const fi = faces.indexOf(S.face);
  document.getElementById("face").innerHTML = S.face + "<small>" + (fi + 1) + " из " + faces.length + "</small>";
  document.getElementById("facePrev").onclick = () => { haptic(); set("face", faces[(fi - 1 + faces.length) % faces.length]); };
  document.getElementById("faceNext").onclick = () => { haptic(); set("face", faces[(fi + 1) % faces.length]); };
  const same = by(r => r.race === S.race && r.face === S.face);
  chips(document.getElementById("hair"), uniq(same.map(r => r.hair)), S.hair, v => hairName(v, g), "hair");
  const cols = uniq(same.filter(r => r.hair === S.hair).map(r => r.colour)).filter(c => c !== "-");
  const sw = document.getElementById("colour"); sw.innerHTML = "";
  const noHair = S.colour === "-";
  for (const c of Object.keys(COLOUR).filter(c => cols.includes(c))) {
    const b = document.createElement("button");
    b.className = c === S.colour ? "on" : "";
    b.innerHTML = '<i style="background:' + COLOUR[c][1] + '"></i>' + COLOUR[c][0];
    b.disabled = noHair;
    b.onclick = () => { haptic(); set("colour", c); };
    sw.appendChild(b);
  }
  document.getElementById("colourHint").hidden = !noHair;
  document.getElementById("beardPanel").hidden = g === "female";
  if (g === "male") chips(document.getElementById("beard"), ["none", "short", "mid"], S.beard, v => BEARD[v], "beard",
                          v => same.some(r => r.beard === v && r.hair === S.hair));
}

let shown = 0;
function show(r) {
  S = { ...r };
  const a = document.getElementById(shown ? "pic2" : "pic"), b = document.getElementById(shown ? "pic" : "pic2");
  const src = IMG + r.seed + ".webp";
  b.onload = () => { b.classList.remove("hide"); a.classList.add("hide"); shown = 1 - shown; };
  b.src = src;
  document.getElementById("seed").textContent = "сид " + r.seed;
  render();
}

function haptic() { try { Telegram.WebApp.HapticFeedback.selectionChanged(); } catch (e) {} }

document.getElementById("dice").onclick = () => { haptic(); show(rows[Math.floor(Math.random() * rows.length)]); };
document.getElementById("foot").textContent = rows.length + " вариантов внешности · кадры из игры";
try { const tg = Telegram.WebApp; tg.ready(); tg.expand(); tg.setHeaderColor("#161614"); tg.setBackgroundColor("#161614"); } catch (e) {}
document.getElementById("pic").src = IMG + rows[0].seed + ".webp";
S = { ...rows[0] }; document.getElementById("seed").textContent = "сид " + rows[0].seed; render();
